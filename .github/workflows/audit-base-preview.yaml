name: Audit exact main-base package preview

on:
  push:
    branches: [continuation/ccusage-base-preview-20261004]

permissions:
  contents: read

# This temporary workflow may run only for an explicitly pushed preparation
# branch and only under the repository owner account. Every checkout and build
# below is pinned to BASE_SHA, never to the workflow branch tip.
env:
  BASE_SHA: 4a26d955a69871c1349cfed1dd6395f0f760300d
  BASE_VERSION: 20.0.26

jobs:
  build-native-packages:
    if: github.repository == 'saagpatel/ccusage' && github.actor == 'saagpatel'
    name: ${{ matrix.name }}
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: result/bin/ccusage
          - name: build-linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: macos-26
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-mac-x64
            os: macos-26
            platform: darwin
            arch: x64
            binary: result/bin/ccusage
          - name: build-windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: base-preview-${{ matrix.name }}
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: base-preview-${{ matrix.name }}
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}

  publish-and-verify-base-preview:
    if: github.repository == 'saagpatel/ccusage' && github.actor == 'saagpatel'
    needs: build-native-packages
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - uses: ./.github/actions/setup-nix-cache
      - name: Install pinned packaging tools
        run: nix profile install --print-build-logs --inputs-from . .#pnpm nixpkgs#nodejs .#publint
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore exact-base native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - name: Confirm every target binary exists
        run: |
          test -s packages/ccusage-linux-arm64/bin/ccusage
          test -s packages/ccusage-linux-x64/bin/ccusage
          test -s packages/ccusage-darwin-arm64/bin/ccusage
          test -s packages/ccusage-darwin-x64/bin/ccusage
          test -s packages/ccusage-win32-x64/bin/ccusage.exe
      - name: Publish exact-base packages
        id: publish
        run: pnpm dlx pkg-pr-new@0.0.75 publish --pnpm --bin --no-compact './apps/ccusage' './packages/ccusage-linux-arm64' './packages/ccusage-linux-x64' './packages/ccusage-darwin-arm64' './packages/ccusage-darwin-x64' './packages/ccusage-win32-x64'
      - name: Require full-SHA main package URL
        id: preview
        env:
          URLS: ${{ steps.publish.outputs.urls }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const sha = process.env.BASE_SHA;
          const urls = (process.env.URLS ?? '').split(/\s+/).filter(Boolean);
          const expected = `https://pkg.pr.new/saagpatel/ccusage/ccusage@${sha}`;
          if (!urls.includes(expected)) {
            throw new Error(`Expected exact-base URL ${expected}; got: ${urls.join(', ')}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${expected}\n`);
          JS
      - name: Bounded GET of exact-base preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          status="$(curl --fail --location --silent --show-error --max-time 60 --range 0-0 --max-filesize 33554432 --output "$RUNNER_TEMP/base-preview-probe.tgz" --write-out '%{http_code}' "$PREVIEW_URL")"
          case "$status" in
            200|206) ;;
            *) echo "Expected bounded GET 200 or 206; received $status" >&2; exit 1 ;;
          esac
      - name: Install package and verify base version and native execution
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          install_dir="$RUNNER_TEMP/ccusage-base-preview-smoke"
          mkdir -p "$install_dir"
          npm install --prefix "$install_dir" --no-save --ignore-scripts --no-audit --no-fund "$PREVIEW_URL"
          manifest_version="$(node -p "require('$install_dir/node_modules/ccusage/package.json').version")"
          test "$manifest_version" = "$BASE_VERSION"
          test -x "$install_dir/node_modules/@ccusage/ccusage-linux-x64/bin/ccusage"
          cmp packages/ccusage-linux-x64/bin/ccusage "$install_dir/node_modules/@ccusage/ccusage-linux-x64/bin/ccusage"
          "$install_dir/node_modules/@ccusage/ccusage-linux-x64/bin/ccusage" --version > "$RUNNER_TEMP/native-version.txt"
          "$install_dir/node_modules/.bin/ccusage" --version > "$RUNNER_TEMP/launcher-version.txt"
          diff -u "$RUNNER_TEMP/native-version.txt" "$RUNNER_TEMP/launcher-version.txt"
          "$install_dir/node_modules/.bin/ccusage" --help > /dev/null
